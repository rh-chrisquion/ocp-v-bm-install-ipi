# Required by HPE before installing the operator: the CSI driver needs to run
# privileged, with host network/PID/ports and hostPath mounts, which OpenShift
# denies by default. Source: HPE's Red Hat OpenShift deployment guide
# (https://scod.hpedev.io/csi_driver/partners/redhat_openshift/index.html).
# Static content — not backend-specific, safe to check into git as-is.
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: hpe-csi-controller-scc
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: true
readOnlyRootFilesystem: true
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
users:
  - system:serviceaccount:hpe-storage:hpe-csi-controller-sa
volumes:
  - hostPath
  - emptyDir
  - projected
---
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: hpe-csi-node-scc
allowHostDirVolumePlugin: true
allowHostIPC: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: true
allowPrivilegeEscalation: true
allowPrivilegedContainer: true
allowedCapabilities:
  - SYS_ADMIN
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
readOnlyRootFilesystem: false
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:hpe-storage:hpe-csi-node-sa
volumes:
  - emptyDir
  - hostPath
  - projected
  - configMap
---
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: hpe-csi-csp-scc
allowHostDirVolumePlugin: true
readOnlyRootFilesystem: false
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
users:
  - system:serviceaccount:hpe-storage:hpe-csp-sa
volumes:
  - hostPath
  - emptyDir
  - projected
---
# Only needed if the NFS Server Provisioner (file storage) is used. Grants the
# default "hpe-nfs" namespace's service account the required capabilities.
kind: SecurityContextConstraints
apiVersion: security.openshift.io/v1
metadata:
  name: hpe-csi-nfs-scc
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowedCapabilities:
  - SYS_ADMIN
  - DAC_READ_SEARCH
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
readOnlyRootFilesystem: false
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users:
  - system:serviceaccount:hpe-nfs:hpe-csi-nfs-sa
volumes:
  - persistentVolumeClaim
  - configMap
  - projected
