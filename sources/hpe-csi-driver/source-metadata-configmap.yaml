apiVersion: v1
kind: ConfigMap
metadata:
  name: hpe-csi-driver-source
  namespace: openshift-gitops
data:
  purpose: >-
    HPE CSI Driver for Kubernetes, providing the shared block StorageClass
    (backed by an HPE primary storage array) that VM disks used in on-prem
    cluster validation need in order to survive live migration and hard node
    failure — node-local storage cannot follow the VM to another node.
  scope: "on-prem clusters with an HPE storage backend (Alletra/Nimble/Primera/3PAR) reachable from every node"
