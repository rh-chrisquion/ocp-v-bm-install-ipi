apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: example-iscsi-network
spec:
  maxUnavailable: 1
  nodeSelector:
    kubernetes.io/hostname: worker-0.example.com
  desiredState:
    interfaces:
      - name: storage-port-a
        type: ethernet
        state: up
        mtu: 9000
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: storage-port-b
        type: ethernet
        state: up
        mtu: 9000
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: bond-storage
        type: bond
        state: up
        mtu: 9000
        link-aggregation:
          mode: 802.3ad
          options:
            miimon: '100'
            lacp_rate: fast
            xmit_hash_policy: layer3+4
          port:
            - storage-port-a
            - storage-port-b
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: storage-vlan
        type: vlan
        state: up
        mtu: 9000
        vlan:
          base-iface: bond-storage
          id: 100
        ipv4:
          enabled: true
          dhcp: false
          address:
            # RFC 5737 documentation address; replace before applying.
            - ip: 192.0.2.10
              prefix-length: 24
        ipv6:
          enabled: false
