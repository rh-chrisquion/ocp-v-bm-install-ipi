---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: iscsi-mtu9000
spec:
  nodeSelector:
    node-role.kubernetes.io/master: ""
  desiredState:
    interfaces:
      # Physical interface eno6 - MTU 9000
      - name: eno6
        type: ethernet
        state: up
        mtu: 9000
        ipv4:
          enabled: false
          dhcp: false
        ipv6:
          enabled: false
          dhcp: false
          autoconf: false

      # Physical interface ens2f1 - MTU 9000
      - name: ens2f1
        type: ethernet
        state: up
        mtu: 9000
        ipv4:
          enabled: false
          dhcp: false
        ipv6:
          enabled: false
          dhcp: false
          autoconf: false

      # Bond0 interface - MTU 9000 with LACP
      - name: bond0
        type: bond
        state: up
        mtu: 9000
        link-aggregation:
          mode: 802.3ad
          options:
            miimon: '100'
            lacp_rate: fast
            xmit_hash_policy: layer3+4
          port:
            - eno6
            - ens2f1
        ipv4:
          enabled: false
          dhcp: false
        ipv6:
          enabled: false
          dhcp: false
          autoconf: false

      # VLAN 416 for iSCSI - MTU 9000
      - name: vlan416
        type: vlan
        state: up
        mtu: 9000
        vlan:
          base-iface: bond0
          id: 416
        ipv4:
          enabled: true
          dhcp: true
          auto-dns: true
          auto-gateway: true
          auto-routes: true
        ipv6:
          enabled: true
          dhcp: true
          autoconf: true
          auto-dns: true
          auto-gateway: true
          auto-routes: true
