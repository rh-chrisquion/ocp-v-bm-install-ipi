---
# Template: AWS_REGION is substituted by the day-1 install script (envsubst).
#
# Auth uses ambient IRSA credentials injected into the external-secrets pod by
# the ROSA aws-pod-identity webhook (SA annotation eks.amazonaws.com/role-arn).
# Do not set auth.jwt.serviceAccountRef audiences here: TokenRequest JWTs on
# OpenShift often carry multiple audiences and STS rejects them with
# InvalidIdentityToken.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
