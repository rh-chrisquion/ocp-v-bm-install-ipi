---
# Deploys the External Secrets operand (controller/webhook/cert-controller)
# into the external-secrets namespace. Applied after the ESO operator CSV is
# Succeeded so the ExternalSecretsConfig CRD exists.
#
# Red Hat ESO installs deny-all NetworkPolicies by default. Without an egress
# allow for TCP/443, AssumeRoleWithWebIdentity to STS times out and
# ClusterSecretStore stays InvalidProviderConfig ("unable to validate store").
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  namespace: external-secrets-operator
spec:
  controllerConfig:
    networkPolicies:
      - name: allow-aws-https-egress
        componentName: ExternalSecretsCoreController
        egress:
          - ports:
              - port: 443
                protocol: TCP
