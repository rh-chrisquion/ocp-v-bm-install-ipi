---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
spec:
  # Cluster-scoped OperatorGroup (all namespaces). Matches Red Hat ESO docs.
  targetNamespaces: []
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
spec:
  channel: stable-v1
  # Automatic for the initial InstallPlan only. The day-1 install script
  # patches this to Manual after the CSV reaches Succeeded so later upgrades
  # require explicit approval.
  installPlanApproval: Automatic
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
