---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rosa-hcp-hub-terraform-source
  namespace: openshift-gitops
data:
  purpose: >-
    Terraform source for ROSA HCP central management hub deployment,
    including day-1 OpenShift GitOps and External Secrets Operator install,
    app-of-apps repository/ApplicationSet bootstrap, ExternalSecretsConfig
    operand, IRSA IAM role, and ClusterSecretStore for AWS Secrets Manager
  terraformRoot: "terraform"
  day1Manifests: "manifests"
  esoManifests: "manifests/eso"
  gitopsManifests: "manifests/gitops"
