apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-availability-source
  namespace: openshift-gitops
data:
  purpose: >-
    Node Health Check + Self Node Remediation + Fence Agents Remediation operators,
    so a hard-failed node is detected and fenced and its workloads (including
    OpenShift Virtualization VMs) fail over automatically instead of waiting on
    the default ~5-6 minute NotReady toleration.
  scope: "on-prem clusters validating node-failure / workload-failover behavior"
